<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - Garagem UniRV'">Formulário de Reserva</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header>
        <div class="header-container">
            <a href="/" class="logo">🚘 Garagem <span>UniRV</span></a>
            <nav>
                <ul>
                    <li><a href="/" class="active">Reservas</a></li>
                    <li><a href="/veiculos">Veículos</a></li>
                    <li><a href="/pessoas">Pessoas</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="card" style="max-width: 650px; margin: 0 auto;">
            <div class="card-header">
                <h1 class="card-title" th:text="${titulo}">Formulário de Reserva</h1>
                <a href="/reservas" class="btn btn-secondary">⬅️ Voltar</a>
            </div>

            <div th:if="${erro}" class="alert-danger" th:text="${erro}">
                Mensagem de erro aqui.
            </div>

            <form th:action="${reserva.id != 0} ? @{/reservas/{id}/editar(id=${reserva.id})} : @{/reservas/novo}" th:object="${reserva}" method="post">

                <div class="form-group">
                    <label class="form-label" for="veiculoId">Veículo *</label>
                    <select id="veiculoId" th:field="*{veiculoId}" class="form-control" required th:disabled="${reserva.id != 0}">
                        <option value="">-- Selecione um Veículo --</option>
                        <option th:each="v : ${veiculos}" 
                                th:value="${v.id}" 
                                th:text="${v.placa + ' - ' + v.marca + ' ' + v.modelo + ' (' + v.ano + ')'}">
                            ABC-1D23 - Toyota Corolla (2022)
                        </option>
                    </select>
                    <!-- Em caso de edição com disabled, envia o veiculoId via input hidden -->
                    <input type="hidden" th:if="${reserva.id != 0}" th:field="*{veiculoId}" />
                </div>

                <div class="form-group">
                    <label class="form-label" for="pessoaId">Pessoa Responsável *</label>
                    <select id="pessoaId" th:field="*{pessoaId}" class="form-control" required th:disabled="${reserva.id != 0}">
                        <option value="">-- Selecione uma Pessoa --</option>
                        <option th:each="p : ${pessoas}" 
                                th:value="${p.id}" 
                                th:text="${p.nome + ' (CPF: ' + p.cpf + ')'}">
                            Ana Souza (CPF: 111.222.333-44)
                        </option>
                    </select>
                    <!-- Em caso de edição com disabled, envia o pessoaId via input hidden -->
                    <input type="hidden" th:if="${reserva.id != 0}" th:field="*{pessoaId}" />
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label" for="dataInicio">Data de Início *</label>
                        <input type="date" id="dataInicio" th:field="*{dataInicio}" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="dataFim">Data de Fim *</label>
                        <input type="date" id="dataFim" th:field="*{dataFim}" class="form-control" required>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="/reservas" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">💾 Salvar Reserva</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 UniRV - Arquitetura de Software ESW430 | Garagem de Veículos (Entrega 2)</p>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.4rem;">Integrantes: Nycolas • Wander • Lucas • Elias</p>
    </footer>

</body>
</html>
