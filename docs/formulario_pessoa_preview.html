<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Preview - Formulário de Pessoa (Entrega 1)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .card { background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 2rem; max-width: 600px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.5rem; }
        input { width: 100%; padding: 0.75rem 1rem; background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; box-sizing: border-box; }
        .btn { padding: 0.65rem 1.25rem; border-radius: 8px; font-weight: 600; border: none; text-decoration: none; cursor: pointer; }
        .btn-success { background: #10b981; color: white; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; }
        .form-actions { display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2>✏️ Cadastrar Nova Pessoa</h2>
            <button class="btn btn-secondary">⬅️ Voltar</button>
        </div>
        <form>
            <div class="form-group">
                <label>Nome Completo *</label>
                <input type="text" value="Ana Souza">
            </div>
            <div class="form-group">
                <label>CPF *</label>
                <input type="text" value="111.222.333-44">
            </div>
            <div class="form-group">
                <label>E-mail *</label>
                <input type="email" value="ana.souza@email.com">
            </div>
            <div class="form-group">
                <label>Telefone (Opcional)</label>
                <input type="text" value="(64) 99999-0001">
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary">Cancelar</button>
                <button type="button" class="btn btn-success">💾 Salvar Pessoa</button>
            </div>
        </form>
    </div>
</body>
</html>
